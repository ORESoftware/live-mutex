name: one-time code style autofix

on:
  push:
    branches:
      - chore/apply-code-style-full

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[style-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/apply-code-style-full

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ESLint toolchain
        run: npm install --global eslint typescript-eslint

      - name: Apply repository ESLint fixes
        shell: bash
        run: |
          set -euo pipefail
          export ORES_LINT_GLOBAL_ROOT="$(npm root --global)"
          eslint . --fix

      - name: Commit style-only changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No autofix changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply eslint autofixes [style-autofix]"
          git push origin HEAD:chore/apply-code-style-full
