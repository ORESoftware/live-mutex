name: lock safety contracts

on:
  pull_request:
    paths:
      - src/**
      - test/pr-lock-safety.e2e.test.js
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.esm.json
      - .github/workflows/pr-lock-safety.yml
  push:
    branches: [dev]
    paths:
      - src/**
      - test/pr-lock-safety.e2e.test.js
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.esm.json
      - .github/workflows/pr-lock-safety.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build CommonJS and ESM artifacts
        run: npm run build
      - name: Run wrong-owner, semaphore-cleanup, and queued-waiter journeys
        run: node --test test/pr-lock-safety.e2e.test.js
