version: 2.1

commands:
  checkout_https:
    steps:
      - run:
          name: Checkout exact commit over HTTPS
          command: |
            set -euo pipefail
            git clone --filter=blob:none https://github.com/ORESoftware/live-mutex.git .
            git checkout --detach "$CIRCLE_SHA1"

jobs:
  build-node22:
    resource_class: small
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout_https
      - run:
          name: Build and test on Node 22
          command: ./scripts/circleci/run.sh

  build-node24:
    resource_class: small
    docker:
      - image: cimg/node:24.16.0
    steps:
      - checkout_https
      - run:
          name: Build and test on Node 24
          command: ./scripts/circleci/run.sh

workflows:
  build_nodejs:
    jobs:
      - build-node22
      - build-node24
